x_enabled = false
x_daily_calls = 6 # At most 60 returned posts/day, separate from model budget
x_cache_hours = 4
# Engineering defaults, not optimized investment parameters.
broker_url = "https://paper-api.alpaca.markets"
database = "state/ledger.sqlite"
initial_capital = "100000"
experiment_weeks = 12
max_position = "0.10"
max_sector = "0.40"
max_positions = 10
max_cumulative_loss_fraction = "0.10" # Loss / original capital, excluding external flows; provisional paper limit.
max_daily_loss_fraction = "0.02" # Loss / prior broker close equity; provisional paper limit.
# checkpoint_bucket = "your-private-recovery-bucket" # Require verified GCS replication before POST; GCE identity.
# executor_fence = true # Cloud mutations require this VM to match executor-owner.json in that bucket.
turnover_30d = "1.0" # Gross filled + pending notional / current equity over 30 days
cooldown_hours = 24
price_tolerance = "0.005"
max_spread_fraction = "0.005" # Spread / midpoint; engineering limit, not a validated strategy parameter.
max_quote_participation = "0.10" # At most 10% of displayed executable-side size; not guaranteed liquidity.
max_order_equity = "0.02" # Maximum notional per order / account equity; no automatic slicing.
fee_buffer = "1"
quote_max_age_seconds = 60
halt_max_age_seconds = 180
order_ttl_minutes = 30
time_in_force = "day"
feed = "iex" # Free real-time IEX venue data for US stocks; optional "sip" needs consolidated-data entitlement.
poll_seconds = 60
trigger_minutes = 15
research_cache_hours = 12
flovia_x_enabled = false
flovia_x_daily_calls = 6 # Total X search attempts per UTC day
flovia_x_cache_hours = 4
event_debounce_minutes = 15
price_trigger = "0.05"
preopen_minutes = 45
model = "gpt-6.1-sol" # Default: business, valuation, and adversarial research.
reasoning_effort = "medium"
# Shared limits across the lead and all four specialists, per research run.
research_max_model_calls = 24
research_max_tool_calls = 48
research_max_seconds = 600
research_max_input_bytes = 180000
research_max_output_tokens = 3000
research_max_cost_usd = "5" # Estimated ceiling, not a spending target or billing guarantee.
research_daily_cost_usd = "10" # Shared across runs/restarts; New York date when each run starts.
sec_user_agent = "" # Your application name and contact email, as required by SEC.
# Budget ceilings in USD / million tokens, verified 2026-11-08.
# Input uses the highest Standard short-context cache-write rate (12h); not actual billed usage.
input_cost_per_million = "5"
output_cost_per_million = "10"

[role_models.research_lead]
model = "gpt-6-astra" # Planning, delegation, and final synthesis.
reasoning_effort = "high"
input_cost_per_million = "25"
output_cost_per_million = "50"

[role_models.catalysts]
model = "gpt-6.1-terra" # Focused news/event review; deeper analysis remains with Sol/Astra.
reasoning_effort = "low"
input_cost_per_million = "2.5"
output_cost_per_million = "5"

# Operator-verified stock universe and sectors. Research ranks this list; these are examples,
# not recommendations. Add more US-listed common stocks with SEC CIK and sector before running.
[universe.AAPL]
sector = "Information Technology"
cik = "320193"
[universe.MSFT]
sector = "Information Technology"
cik = "789019"
[universe.AMZN]
sector = "Consumer Discretionary"
cik = "1018724"
